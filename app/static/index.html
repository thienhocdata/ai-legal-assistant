<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Trợ lý tra cứu Luật Đất đai Việt Nam có trích dẫn Điều, Khoản, Điểm." />
    <title>Minh Long · AI Legal Assistant</title>
    <link rel="stylesheet" href="/static/styles.css?v=20261118-chat" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Trang chủ Minh Long">
          <span class="brand-mark" aria-hidden="true">ML</span>
          <span><strong>Minh Long</strong><small>Trợ lý đất đai</small></span>
        </a>
        <div class="status"><span id="status-dot"></span><span id="status-text">Đang kiểm tra hệ thống</span></div>
      </header>

      <main>
        <section class="chat-panel" aria-label="Khu vực hỏi đáp">
            <div id="messages" class="messages" aria-live="polite">
              <article class="message assistant">
                <div class="avatar" aria-hidden="true">ML</div>
                <div class="bubble">
                  <p>Chào bạn, mình là trợ lý tra cứu pháp luật đất đai của Minh Long. Bạn muốn tìm hiểu điều gì?</p>
                </div>
              </article>
            </div>

            <form id="chat-form" class="composer">
              <label class="sr-only" for="question">Câu hỏi pháp luật đất đai</label>
              <textarea id="question" rows="2" maxlength="2000" placeholder="Nhập câu hỏi pháp luật đất đai…" required></textarea>
              <button id="submit" type="submit" aria-label="Gửi câu hỏi"><span>Gửi</span><b aria-hidden="true">→</b></button>
            </form>
            <p class="notice">Thông tin để tham khảo. Cần đối chiếu căn cứ trước khi áp dụng; không thay thế tư vấn pháp lý.</p>
        </section>
      </main>
    </div>
    <script src="/static/app.js?v=20261118-context" defer></script>
  </body>
</html>
